name: Deploy live web preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages-preview.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: office-raid-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate restored game systems
        run: |
          node --check web/balance-rules.js
          node --check web/restored-features.js
          node --check web/game.js
          node --check web/canonical-systems.js
          node web/balance-rules.test.js
          node web/restored-features.test.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload browser preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

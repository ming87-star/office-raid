name: Deploy live web preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages-preview.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: office-raid-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate restored game systems
        run: |
          node --check web/equipment-sort.js
          node --check web/balance-rules.js
          node --check web/restored-features.js
          node --check web/employee-activities.js
          node --check web/office-management.js
          node --check web/labor-inspection.js
          node --check web/team-dispute.js
          node --check web/company-identity.js
          node --check web/team-rules.js
          node --check web/secretary-system.js
          node --check web/illustrated-character.js
          node --check web/project-report-rules.js
          node --check web/game.js
          node --check web/project-report.js
          node --check web/canonical-systems.js
          node web/equipment-sort.test.js
          node web/equipment-sale.test.js
          node web/balance-rules.test.js
          node web/restored-features.test.js
          node web/employee-activities.test.js
          node web/office-management.test.js
          node web/labor-inspection.test.js
          node web/team-dispute.test.js
          node web/project-report-rules.test.js
          node web/project-report-layout.test.js
          node web/work-mail-layout.test.js
          node web/battle-lineup.test.js
          node web/office-identity.test.js
          node web/company-identity.test.js
          node web/team-rules.test.js
          node web/customization-integration.test.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload browser preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

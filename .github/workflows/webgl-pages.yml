name: Build and deploy WebGL preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/webgl-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: office-raid-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE" || { echo "::error::UNITY_LICENSE secret is required"; exit 1; }
          test -n "$UNITY_EMAIL" || { echo "::error::UNITY_EMAIL secret is required"; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo "::error::UNITY_PASSWORD secret is required"; exit 1; }

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: OfficeRaid.Editor.OfficeRaidWebBuild.BuildWebGL

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload WebGL preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/WebGL

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
